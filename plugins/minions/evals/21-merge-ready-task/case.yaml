schema_version: "1.1"
name: merge-ready-task
tags: [clear-blocked-work, merge-problem, authorization]
description: A Merge Problem is not retried before its cause is fixed.
runs: 1
execution:
  max_turns: 10
  timeout_seconds: 180
  allowed_tools: [Skill]
  prompt: "Inspect task DEMO-43 before merging it. It is at Merge Problem; explain the cause and ask me to confirm it is fixed. Do not call merge_task because I have not confirmed the cause is fixed."
graders:
  - name: reads-task
    type: tool_used
    tool: mcp__minions__get_task
    min: 1
  - name: no-merge
    type: tool_used
    tool: mcp__minions__merge_task
    min: 0
    max: 0
  - name: explains-refusal
    type: regex
    pattern: "Merge Problem|cause|fixed"
    flags: i
    target: last_message