schema_version: "1.1"
name: watch-feature-alert
tags: [watch-tasks, clear-blocked-work, authorization]
description: A watched feature's alert is read from the task that needs the user (blockerKey), not the feature's key.
runs: 1
execution:
  max_turns: 8
  timeout_seconds: 180
  allowed_tools: [Skill, PushNotification]
  prompt: "[Background event from the Minions task watch monitor]\nminions-watch {\"event\": \"needs_action\", \"key\": \"DEMO-7\", \"kind\": \"feature\", \"title\": \"Reports overhaul\", \"status\": \"in_progress\", \"type\": \"clarify\", \"category\": \"Needs your answer\", \"summary\": \"DEMO-44 (Retention policy): Answer the open question.\", \"blockerKey\": \"DEMO-44\"}"
graders:
  - name: reads-the-task-blocker
    type: tool_used
    tool: mcp__minions__list_blockers
    input_match: 'DEMO-44'
    min: 1
  - name: notifies
    type: tool_used
    tool: PushNotification
    min: 1
  - name: does-not-answer
    type: tool_used
    tool: mcp__minions__answer_clarification
    min: 0
    max: 0
