schema_version: "1.1"
name: someones-tasks-in-repo
tags: [report-status, authorization]
description: Find another person's tasks in a repository.
runs: 1
execution:
  max_turns: 10
  timeout_seconds: 180
  allowed_tools: [Skill]
  prompt: "Show me Sam's open tasks in repo-callpilot. Sam is sam@example.test."
graders:
  - name: lists-tasks
    type: tool_used
    tool: mcp__minions__list_tasks
    min: 1
  - name: owner-filter
    type: input_match
    pattern: '"owner"\s*:\s*"(sam@example\.test|me)"'
  - name: no-list-mine
    type: tool_used
    tool: mcp__minions__list_my_tasks
    min: 0
    max: 0
  - name: no-get-task
    type: tool_used
    tool: mcp__minions__get_task
    min: 0
    max: 0
  - name: no-owner-change
    type: tool_used
    tool: mcp__minions__set_task_owner
    min: 0
    max: 0
  - name: no-merge
    type: tool_used
    tool: mcp__minions__merge_task
    min: 0
    max: 0
