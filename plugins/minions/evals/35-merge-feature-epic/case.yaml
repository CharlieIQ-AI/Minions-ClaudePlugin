schema_version: "1.1"
name: merge-feature-epic
tags: [features, merge, consent]
description: An epic is inspected with get_feature and landed with merge_feature only after consent.
runs: 1
execution:
  max_turns: 10
  timeout_seconds: 180
  allowed_tools: [Skill]
  prompt: "/merge DEMO-48"
graders:
  - name: reads-feature
    type: tool_used
    tool: mcp__minions__get_feature
    min: 1
  - name: no-task-merge
    type: tool_used
    tool: mcp__minions__merge_task
    min: 0
    max: 0
  - name: reports-phase
    type: regex
    pattern: "phase|paused"
    flags: i
    target: last_message
