schema_version: "1.1"
name: pipeline-health
tags: [report-status, read-only]
runs: 1
execution:
  max_turns: 8
  timeout_seconds: 180
  allowed_tools: [Skill]
  prompt: "How are the repos doing in Minions, and which repos have problems? Report it only — do not answer, approve, merge, pause, or change anything."
graders:
  - name: uses-health
    type: tool_used
    tool: mcp__minions__get_pipeline_health
    min: 1
  - name: no-merge
    type: tool_used
    tool: mcp__minions__merge_task
    min: 0
    max: 0
  - name: no-answer
    type: tool_used
    tool: mcp__minions__answer_clarification
    min: 0
    max: 0
  - name: no-ci-resolution
    type: tool_used
    tool: mcp__minions__resolve_ci_fix
    min: 0
    max: 0
  - name: no-pause
    type: tool_used
    tool: mcp__minions__pause_task
    min: 0
    max: 0
